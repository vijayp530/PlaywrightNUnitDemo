name: Playwright NUnit Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  test:

    runs-on: windows-latest

    steps:

    # 1. Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v4


    # 2. Install .NET
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'


    # 3. Restore NuGet packages
    - name: Restore Packages
      run: dotnet restore


    # 4. Build project
    - name: Build Project
      run: dotnet build --configuration Release --no-restore


    # 5. Install Playwright browsers
    - name: Install Playwright Browsers
      run: pwsh bin/Release/net10.0/playwright.ps1 install


    # 6. Execute NUnit tests and generate TRX
    - name: Run Playwright NUnit Tests
      run: dotnet test --configuration Release --logger "trx;LogFileName=test-results.trx"
      continue-on-error: true

    # 10. Upload screenshots and traces
    - name: Upload Playwright Evidence
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: Playwright-Screenshots-Traces
        path: "**/test-results/**"
        if-no-files-found: ignore